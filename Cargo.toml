[package]
name = "french-amount-words"
version = "0.1.1"
description = "Spells out numbers and euro amounts in French words (traditional spelling)"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/prygrn/french-amount-words"
documentation = "https://docs.rs/french-amount-words"
readme = "README.md"
keywords = ["french", "numbers", "words", "euro", "amount"]
categories = ["localization", "value-formatting", "finance"]
include = ["/src/**", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[lints.rust]
unsafe_code = "forbid"
